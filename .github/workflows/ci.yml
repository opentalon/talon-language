name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./...

  js-runtime:
    name: JS Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd packages/runtime && npm ci && npm test

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  tln-test:
    name: tln Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./cmd/tln
      - run: ./tln build examples/fleet_maintenance.tln
      - run: ./tln test -v --junit junit-tln.xml examples/fleet_maintenance.tln test/fleet_maintenance.tln.test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tln-junit
          path: junit-tln.xml

  tln-datalevin:
    name: tln + Datalevin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install Datalevin
        run: |
          curl -sL https://github.com/datalevin/datalevin/releases/download/0.10.7/dtlv-0.10.7-ubuntu-22.04-amd64.zip -o dtlv.zip
          unzip dtlv.zip
          chmod +x dtlv
          sudo mv dtlv /usr/local/bin/
          dtlv --help | head -1
      - run: go build ./cmd/tln
      - run: ./tln build examples/fleet_maintenance.tln
      - name: Run Datalevin integration test
        run: |
          output=$(dtlv exec -f /dev/stdin < examples/test_datalevin.clj)
          echo "$output"
          echo "$output" | grep -q ":service-overdue" || { echo "FAIL: missing query results"; exit 1; }

  # ── tln-db integration ───────────────────────────────────────────────────
  # tln-db is now an external backend (no longer a core dependency). This job
  # is a smoke: it clones the renamed opentalon/tln-db and builds its server so
  # a breaking change to the wire/build surface is still caught here. The full
  # FactStore↔server integration test lives in the tln-db repo (which is allowed
  # to import tln-language/pkg/factstore); it is not run here to keep core free
  # of a tln-db dependency.
  tln-db:
    name: tln + tln-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Clone opentalon/tln-db
        run: |
          BRANCH="${GITHUB_HEAD_REF:-master}"
          if ! git clone --depth=1 -b "$BRANCH" https://github.com/opentalon/tln-db.git ../tln-db 2>/dev/null; then
            git clone --depth=1 https://github.com/opentalon/tln-db.git ../tln-db
          fi
      - name: Build tlndb-server
        run: |
          cd ../tln-db
          go build -o /tmp/tlndb-server ./cmd/tlndb-server
      - name: Start tlndb-server (bind check)
        run: |
          rm -f /tmp/tln.bbolt /tmp/tlndb.sock
          /tmp/tlndb-server --db /tmp/tln.bbolt --socket /tmp/tlndb.sock > /tmp/tlndb.log 2>&1 &
          echo "TLNDB_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if [ -S /tmp/tlndb.sock ]; then echo "tlndb-server is up"; break; fi
            sleep 0.5
          done
          [ -S /tmp/tlndb.sock ] || { echo "FAIL: server did not bind socket"; cat /tmp/tlndb.log; exit 1; }
      - name: Stop tlndb-server
        if: always()
        run: kill $TLNDB_PID 2>/dev/null || true

  tln-run:
    name: tln Run (HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Clojure CLI
        run: |
          curl -sL https://download.clojure.org/install/linux-install-1.12.5.1638.sh -o install-clojure.sh
          sudo bash install-clojure.sh || true
          clojure --version
      - run: go build ./cmd/tln
      - name: Start datalevin-server
        run: |
          cd datalevin-server && clojure -M:run &
          for i in $(seq 1 60); do
            sleep 2
            if curl -s http://localhost:8898/health | grep -q ok; then
              echo "datalevin-server is up"
              break
            fi
            echo "waiting... ($i)"
          done
          curl -sf http://localhost:8898/health || { echo "FAIL: server did not start"; exit 1; }
      - name: Run tln with seed from test file
        run: |
          output=$(./tln run examples/fleet_maintenance.tln --seed test/fleet_maintenance.tln.test)
          echo "$output"
          echo "$output" | grep -q "seeded.*entity" || { echo "FAIL: seed did not run"; exit 1; }
          echo "$output" | grep -q "Service overdue.*2 row(s)" || { echo "FAIL: expected 2 overdue vehicles"; exit 1; }
      - name: Smoke tests — schema merge, Retract, FullText, recursive rules
        env:
          DATALEVIN_URL: http://localhost:8898
        run: go test -tags=datalevin -run Smoke -v ./internal/datalevin/...

  bundle-e2e:
    name: Bundle E2E (4 base plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build -o /usr/local/bin/tln ./cmd/tln
      - name: tln init + a program using all four base plugins
        run: |
          tln init demo
          cd demo
          cat > mod.tln <<'EOF'
          plugin "io"     "v0.1.0"
          plugin "prolog" "v0.1.0"
          plugin "asp"    "v0.1.0"
          plugin "mcp"    "v0.1.0"
          EOF
          cat > rules.tln <<'EOF'
          connector "log"    via io     { }
          connector "reason" via prolog { }
          connector "solver" via asp    { }

          workflow "demo" {
            step "greet"     { tool "log" "writeln" { text "bundle-e2e: 4 plugins loaded" } }
            step "ancestors" { tool "reason" "query" { program "parent(tom,bob). parent(bob,ann). ancestor(X,Y):-parent(X,Y). ancestor(X,Y):-parent(X,Z),ancestor(Z,Y)." goal "ancestor(tom, D)" } }
            step "models"    { tool "solver" "solve" { program "p :- not q.  q :- not p." } }
          }
          EOF
      - name: tln bundle (compiles the 4 plugins) + tln run
        env:
          # The four plugin modules may be freshly published; skip the checksum
          # DB and let direct git fetch use the Actions token, so the bundle's
          # `go build` doesn't fail on proxy/sumdb propagation lag.
          GOSUMDB: "off"
          GOPROXY: "https://proxy.golang.org,direct"
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          cd demo
          tln bundle
          tln run rules.tln | tee out.txt
          grep -q "bundle-e2e: 4 plugins loaded" out.txt || { echo "FAIL: bundle did not run the io plugin"; exit 1; }
