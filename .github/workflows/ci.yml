name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Clone talon-db sibling (for local replace directive)
        run: git clone --depth=1 https://github.com/opentalon/talon-db.git ../talon-db
      - run: go test ./...

  js-runtime:
    name: JS Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd packages/runtime && npm ci && npm test

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Clone talon-db sibling (for local replace directive)
        run: git clone --depth=1 https://github.com/opentalon/talon-db.git ../talon-db
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  talon-test:
    name: Talon Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Clone talon-db sibling (for local replace directive)
        run: git clone --depth=1 https://github.com/opentalon/talon-db.git ../talon-db
      - run: go build ./cmd/talon
      - run: ./talon build examples/fleet_maintenance.talon
      - run: ./talon test -v --junit junit-talon.xml examples/fleet_maintenance.talon test/fleet_maintenance.talon.test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talon-junit
          path: junit-talon.xml

  talon-datalevin:
    name: Talon + Datalevin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Clone talon-db sibling (for local replace directive)
        run: git clone --depth=1 https://github.com/opentalon/talon-db.git ../talon-db
      - name: Install Datalevin
        run: |
          curl -sL https://github.com/datalevin/datalevin/releases/download/0.10.7/dtlv-0.10.7-ubuntu-22.04-amd64.zip -o dtlv.zip
          unzip dtlv.zip
          chmod +x dtlv
          sudo mv dtlv /usr/local/bin/
          dtlv --help | head -1
      - run: go build ./cmd/talon
      - run: ./talon build examples/fleet_maintenance.talon
      - name: Run Datalevin integration test
        run: |
          output=$(dtlv exec -f /dev/stdin < examples/test_datalevin.clj)
          echo "$output"
          echo "$output" | grep -q ":service-overdue" || { echo "FAIL: missing query results"; exit 1; }

  talon-db:
    name: Talon + talon-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Clone talon-db sibling repo
        run: git clone --depth=1 https://github.com/opentalon/talon-db.git ../talon-db
      - name: Build talondb-server
        run: |
          cd ../talon-db
          go build -o /tmp/talondb-server ./cmd/talondb-server
      - name: Start talondb-server
        run: |
          rm -f /tmp/talon.bbolt /tmp/talondb.sock
          /tmp/talondb-server --db /tmp/talon.bbolt --socket /tmp/talondb.sock > /tmp/talondb.log 2>&1 &
          echo "TALONDB_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if [ -S /tmp/talondb.sock ]; then
              echo "talondb-server is up"
              break
            fi
            sleep 0.5
          done
          [ -S /tmp/talondb.sock ] || { echo "FAIL: server did not bind socket"; cat /tmp/talondb.log; exit 1; }
      - run: go build ./cmd/talon
      - run: ./talon build examples/fleet_maintenance.talon
      - name: Run fleet_maintenance through talon-db
        run: |
          output=$(./talon run examples/fleet_maintenance.talon \
                     --seed test/fleet_maintenance.talon.test \
                     --store talon-db \
                     --talondb unix:///tmp/talondb.sock)
          echo "$output"
          echo "$output" | grep -q "seeded.*entity" || { echo "FAIL: seed did not run"; exit 1; }
          echo "$output" | grep -q "Service overdue.*2 row(s)" || { echo "FAIL: expected 2 overdue vehicles"; exit 1; }
      - name: Stop talondb-server
        if: always()
        run: |
          if [ -n "$TALONDB_PID" ]; then
            kill $TALONDB_PID 2>/dev/null || true
          fi
          cat /tmp/talondb.log 2>/dev/null || true

  talon-run:
    name: Talon Run (HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Clojure CLI
        run: |
          curl -sL https://download.clojure.org/install/linux-install-1.12.5.1638.sh -o install-clojure.sh
          sudo bash install-clojure.sh || true
          clojure --version
      - name: Clone talon-db sibling (for local replace directive)
        run: git clone --depth=1 https://github.com/opentalon/talon-db.git ../talon-db
      - run: go build ./cmd/talon
      - name: Start datalevin-server
        run: |
          cd datalevin-server && clojure -M:run &
          for i in $(seq 1 60); do
            sleep 2
            if curl -s http://localhost:8898/health | grep -q ok; then
              echo "datalevin-server is up"
              break
            fi
            echo "waiting... ($i)"
          done
          curl -sf http://localhost:8898/health || { echo "FAIL: server did not start"; exit 1; }
      - name: Run talon with seed from test file
        run: |
          output=$(./talon run examples/fleet_maintenance.talon --seed test/fleet_maintenance.talon.test)
          echo "$output"
          echo "$output" | grep -q "seeded.*entity" || { echo "FAIL: seed did not run"; exit 1; }
          echo "$output" | grep -q "Service overdue.*2 row(s)" || { echo "FAIL: expected 2 overdue vehicles"; exit 1; }
      - name: Smoke tests — schema merge, Retract, FullText, recursive rules
        env:
          DATALEVIN_URL: http://localhost:8898
        run: go test -tags=datalevin -run Smoke -v ./internal/datalevin/...
