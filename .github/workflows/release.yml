name: Release

# Triggered when a tag matching v* is pushed (e.g. v0.1.0, v1.2.3-rc.1).
# Builds the talon CLI for five OS/arch targets, packages each into a
# tarball (or zip on Windows), and attaches them — together with a
# SHA256SUMS file — to a GitHub release using --generate-notes.
#
# The version string is embedded into the binary via
# `-ldflags "-X main.version=<tag>"`, so `talon version` reports the
# correct value at runtime.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: tar.gz
          - os: linux
            arch: arm64
            ext: tar.gz
          - os: darwin
            arch: amd64
            ext: tar.gz
          - os: darwin
            arch: arm64
            ext: tar.gz
          - os: windows
            arch: amd64
            ext: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Clone talon-db sibling (for local replace directive)
        run: git clone --depth=1 https://github.com/opentalon/talon-db.git ../talon-db

      - name: Build talon
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/staging
          BIN=talon
          if [ "$GOOS" = "windows" ]; then BIN=talon.exe; fi
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${TAG}" \
            -o "dist/staging/${BIN}" \
            ./cmd/talon
          cp LICENSE README.md dist/staging/

      - name: Package archive
        env:
          TAG: ${{ github.ref_name }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: |
          NAME="talon-${TAG}-${OS}-${ARCH}"
          mkdir -p dist/out
          cd dist/staging
          if [ "$EXT" = "zip" ]; then
            zip -q "../out/${NAME}.zip" *
          else
            tar -czf "../out/${NAME}.tar.gz" *
          fi
          cd ../out
          sha256sum "${NAME}.${EXT}" > "${NAME}.${EXT}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: talon-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/out/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build aggregate SHA256SUMS
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            SHA256SUMS.txt talon-*.tar.gz talon-*.zip
